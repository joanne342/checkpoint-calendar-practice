
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Days Calendar</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="web.mjs"></script>
  </head>

  <body>
    <main>
      <h1>Days Calendar</h1>

      <section aria-labelledby="calendar-heading">
        <h2 id="calendar-heading">Calendar</h2>

        <div class="calendar-controls">
          <button id="previous-month" type="button">
            Previous Month
          </button>

          <label for="month-select">Month</label>
          <select id="month-select"></select>

          <label for="year-select">Year</label>
          <select id="year-select"></select>

          <button id="next-month" type="button">
            Next Month
          </button>
        </div>

        <h3 id="current-month" aria-live="polite"></h3>

        <div
          class="calendar-grid"
          id="calendar"
          aria-label="Calendar"
        >
          <div class="weekday">Sunday</div>
          <div class="weekday">Monday</div>
          <div class="weekday">Tuesday</div>
          <div class="weekday">Wednesday</div>
          <div class="weekday">Thursday</div>
          <div class="weekday">Friday</div>
          <div class="weekday">Saturday</div>
        </div>

        <section
          id="day-description"
          aria-labelledby="description-heading"
          hidden
        >
          <h3 id="description-heading">About this day</h3>
          <p id="description-text"></p>
        </section>

        <p id="calendar-error" role="status"></p>
      </section>
    </main>
  </body>
</html>
