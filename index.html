
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Days Calendar</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="web.mjs"></script>
  </head>

  <body>
    <main>
      <h1>Days Calendar</h1>

      <form id="date-picker" class="date-picker">
        <label for="month-select">Month</label>
        <select id="month-select"></select>

        <label for="year-input">Year</label>
        <input
          id="year-input"
          type="number"
          step="1"
          required
        />

        <button type="submit">Go to date</button>
      </form>

      <div class="calendar-controls">
        <button id="previous-month" type="button">
          Previous Month
        </button>

        <h2 id="current-month" aria-live="polite"></h2>

        <button id="next-month" type="button">
          Next Month
        </button>
      </div>

      <div
        class="calendar-grid"
        id="calendar"
        aria-label="Monthly calendar"
      >
        <div class="weekday">Sunday</div>
        <div class="weekday">Monday</div>
        <div class="weekday">Tuesday</div>
        <div class="weekday">Wednesday</div>
        <div class="weekday">Thursday</div>
        <div class="weekday">Friday</div>
        <div class="weekday">Saturday</div>
      </div>
    </main>
  </body>
</html>
